<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Shortener</title>
</head>
<body>

<h2>Simple URL Shortener</h2>

<input id="urlInput" type="text" placeholder="Enter URL" size="50">
<button onclick="shorten()">Shorten</button>

<p id="result"></p>

<script>
    async function shorten() {
        const originalUrl = document.getElementById("urlInput").value.trim();

        if (!originalUrl) {
            document.getElementById("result").textContent = "Please enter a valid URL!";
            return;
        }

        try {
            const response = await fetch("https://my-project-vglg.onrender.com/shorten", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ originalUrl })
            });

            const data = await response.json();

            document.getElementById("result").innerHTML = `
                Short URL: <a href="${data.shortUrl}" target="_blank">${data.shortUrl}</a>
            `;
        } catch (err) {
            document.getElementById("result").textContent = "Error: " + err.message;
        }
    }
</script>

</body>
</html>
