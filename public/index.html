<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cloud Image Gallery</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header class="header">
    <h1>My Cloud Photo Gallery</h1>
    <p class="subtitle">Upload, View and Manage Your Photos</p>
  </header>

  <section class="upload-section">
    <form id="uploadForm">
      <input type="file" id="imageInput" accept="image/*">
      <button type="submit" class="upload-btn">Upload Photo</button>
    </form>
  </section>

  <section class="preview-container">
    <img id="preview" class="preview-img" style="display:none;">
  </section>

  <section class="gallery-container">
    <h2>Your Photos</h2>
    <div id="gallery" class="photo-grid"></div>
  </section>

  <script src="script.js"></script>
</body>
</html>
