<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Image Search</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
        }

        .container {
            max-width: 600px;
            margin: 80px auto;
            background: #1e293b;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border-radius: 8px;
            border: none;
            outline: none;
            margin-bottom: 15px;
        }

        button {
            width: 100%;
            background: #2563eb;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #1d4ed8;
        }

        .result {
            margin-top: 25px;
            text-align: center;
        }

        img {
            max-width: 100%;
            border-radius: 10px;
            margin-top: 20px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.4);
        }

        .error {
            color: #f87171;
            margin-top: 10px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Cloud Image Search</h2>

        <input id="searchBox" type="text" placeholder="Enter image title">

        <button onclick="searchImage()">Search</button>

        <div class="result" id="result"></div>
    </div>

    <script>
        async function searchImage() {
            const title = document.getElementById("searchBox").value.trim();
            const resultDiv = document.getElementById("result");

            if (!title) {
                resultDiv.innerHTML = `<p class="error">Please enter a title.</p>`;
                return;
            }

            resultDiv.innerHTML = "Searching...";

            const response = await fetch(`/search?title=${title}`);
            const data = await response.json();

            if (data.error) {
                resultDiv.innerHTML = `<p class="error">${data.error}</p>`;
                return;
            }

            resultDiv.innerHTML = `
                <a href="/download/${title}" title="Click to download">
                    <img src="${data.url}" alt="Image" style="cursor: pointer;">
                </a>
            `;
        }
    </script>
</body>
</html>
